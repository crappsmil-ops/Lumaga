workflows:
  ios-simulator:
    name: Trinkluma iOS Simulator Test

    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      groups:
        - trinkluma

      xcode: latest
      node: latest

    scripts:
      - name: Install dependencies
        script: |
          npm ci

      - name: Build web app
        script: |
          npm run build

      - name: Sync Capacitor iOS
        script: |
          npx cap sync ios

      - name: Build iOS app without signing
        script: |
          xcodebuild build \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -sdk iphonesimulator \
            -configuration Debug \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

    artifacts:
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app


  ios-testflight:
    name: Trinkluma iOS TestFlight

    instance_type: mac_mini_m2
    max_build_duration: 60

    integrations:
      app_store_connect: "Trinkluma Apple"

    environment:
      groups:
        - trinkluma

      xcode: latest
      node: latest
      cocoapods: default

      ios_signing:
        provisioning_profiles:
          - trinkluma_app_store_profile
        certificates:
          - Trinkluma_Distribution

      vars:
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"

    scripts:
      - name: Install dependencies
        script: |
          npm ci

      - name: Build web app
        script: |
          npm run build

      - name: Sync Capacitor iOS
        script: |
          npx cap sync ios

      - name: Set up iOS signing
        script: |
          xcode-project use-profiles \
            --project ios/App/App.xcodeproj \
            --archive-method app-store \
            --code-signing-setup-verbose-logging

      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --project "$CM_BUILD_DIR/$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false